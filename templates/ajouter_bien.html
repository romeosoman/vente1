<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ajouter un Bien</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h2 class="mb-4">Ajouter un nouveau bien</h2>


	<form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label for="numero">Numéro</label>
            <input type="text" class="form-control" placeholder="Numero" id="numero" name="numero" required>
        </div>

        <div class="form-group">
            <label for="denomination">Dénomination</label>
            <input type="text" class="form-control" placeholder="denomination" id="denomination" name="denomination" required>
        </div>

        <div class="form-group">
            <label for="type">Type</label>
            <input type="text" class="form-control" placeholder="type" id="type" name="type" required>
        </div>

        <div class="form-group">
            <label for="matricule">Matricule</label>
            <input type="text" class="form-control" placeholder="Matricule " id="matricule" name="matricule" required>
        </div>

        <div class="form-group">
            <label for="etat">État</label>
            <textarea class="form-control" placeholder="Etat du bien" id="etat" name="etat"></textarea>
        </div>

        <div class="form-group">
            <label for="prix_depart">Prix de départ (FCFA)</label>
            <input type="number" step="0.01" class="form-control" placeholder="Prix de depart" id="prix_depart" name="prix_depart" required>
        </div>

        <div class="form-group">
            <label for="photo">Photo (nom du fichier dans /static/images/)</label>
			<input type="file" class="form-control" id="photo" name="photo">
        </div>

        <button type="submit" class="btn btn-primary">Ajouter</button>
        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Retour</a>
    </form>
</div>

</body>
</html>
